<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>加州地区电力数据总览</title>
    
    <!-- 引入 Chart.js 及其日期适配器 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    
    <style>
        /* --- 页面基础和布局样式 --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px; /* 适当增加宽度以容纳并排图表 */
            margin: auto;
        }
        .main-title {
            text-align: center;
            font-size: 2.2em;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        /* --- 卡片式布局样式 --- */
        .card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
        }
        .card-title {
            font-size: 1.5em;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            color: #34495e;
        }

        /* --- 流式布局和栅格系统 --- */
        .row {
            display: flex;
            flex-wrap: wrap; /* 在小屏幕上换行 */
            gap: 25px; /* 设置列之间的间距 */
            margin-bottom: 15px;
        }
        .col {
            flex: 1; /* 每列平均分配空间 */
            min-width: 300px; /* 设置一个最小宽度，防止过度压缩 */
            display: flex;
            flex-direction: column;
        }

        /* --- 实时数据标签样式 --- */
        .realtime-labels-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .data-label {
            background-color: #ecf0f1;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 5px solid #3498db;
        }
        .data-label h3 {
            margin: 0 0 8px 0;
            font-size: 1.1em;
            color: #2c3e50;
        }
        .data-label p {
            margin: 0;
            font-size: 1.4em;
            font-weight: bold;
            color: #2980b9;
        }
        .data-label p .time {
            font-size: 0.7em;
            font-weight: normal;
            color: #7f8c8d;
        }

        /* --- 主干电网实时数据样式 --- */
        .hub-lmp-container {
            width: 100%;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        .market-group {
            margin-bottom: 15px;
        }
        .market-group h4 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.1em;
            color: #34495e;
        }
        .market-group .realtime-labels-container {
            gap: 15px; /* 减小间距 */
        }
        .market-group .data-label {
            padding: 10px 15px;
            border-left-width: 4px;
        }
        .market-group .data-label h3 { font-size: 0.9em; }
        .market-group .data-label p { font-size: 1.2em; }


        /* --- 用户控件样式 --- */
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .date-input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #0056b3; }
        .btn:disabled { background-color: #6c757d; cursor: not-allowed; }
        .error-message { color: #dc3545; margin-top: 10px; font-size: 0.9em; min-height: 1.2em; }
        
        /* --- 图表容器与预测按钮的样式 --- */
        .chart-container {
            position: relative;
            flex-grow: 1; /* 让图表容器填满父元素剩余空间 */
            min-height: 400px; 
        }
        .chart-buttons {
            position: absolute;
            top: 10px; right: 45px; z-index: 10;
            display: flex; gap: 8px;
        }
        .forecast-btn {
            background-color: #6c757d; color: white; border: none;
            padding: 5px 10px; border-radius: 4px; font-size: 0.8em;
            cursor: pointer; transition: background-color 0.2s;
        }
        .forecast-btn.active { background-color: #28a745; }
        .forecast-btn:disabled { background-color: #e9ecef; cursor: not-allowed; color: #6c757d; }

        /* 实时和历史主干网络图表布局 */
        #hubRealtimeLmpChartsContainer .col, #lmpChartsContainer .col {
            flex-grow: 0;
            flex-shrink: 0;
            flex-basis: calc(50% - 12.5px);
        }
        @media (max-width: 992px) {
            #hubRealtimeLmpChartsContainer .col, #lmpChartsContainer .col {
                flex-basis: 100%;
            }
        }

        /* 主干电网选择器样式 */
        .hub-selector-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-top: 10px;
        }

        /* --- 历史地区电价查询板块布局 --- */
        .history-lmp-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .history-lmp-wrapper .chart-container {
            flex: 3; /* 图表占 3/4 宽度 */
            min-width: 400px;
        }
        .location-selector-container {
            flex: 1; /* 选择器占 1/4 宽度 */
            min-width: 200px;
            border-left: 1px solid #e0e0e0;
            padding-left: 20px;
        }
        .location-selector {
            max-height: 400px; /* 与图表高度匹配 */
            overflow-y: auto; /* 内容超出时显示滚动条 */
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .location-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .location-item input {
            cursor: pointer;
        }
        .location-item label {
            cursor: pointer;
            font-size: 0.9em;
            word-break: break-all;
        }
        .search-input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

    </style>
</head>
<body>

<div class="container">
    <h1 class="main-title">加州地区电力数据总览</h1>

    <!-- 实时数据单元 -->
    <div class="card">
        <h2 class="card-title">实时数据一览</h2>
        <div class="realtime-labels-container">
            <div class="data-label"><h3>实时负荷 (MW)</h3><p><span id="latestLoadValue">加载中...</span> <span class="time"> @ <span id="latestLoadTime">--:--</span></span></p></div>
            <div class="data-label"><h3>实时储能 (MW)</h3><p><span id="latestStorageValue">加载中...</span> <span class="time"> @ <span id="latestStorageTime">--:--</span></span></p></div>
        </div>
        <!-- 主干电网实时电价容器 -->
        <div id="latestHubLmpContainer" class="hub-lmp-container">
            <!-- JS will populate this -->
        </div>
    </div>

    <!-- 负荷数据图表 -->
    <div class="card">
        <div class="row">
            <!-- 左侧: 实时负荷 -->
            <div class="col">
                <h2 class="card-title">今日实时负荷 (MW)</h2>
                <div class="chart-container">
                    <canvas id="realtimeLoadChart"></canvas>
                </div>
            </div>
            <!-- 右侧: 历史负荷 -->
            <div class="col">
                <h2 class="card-title">历史负荷与预测对比</h2>
                <div class="controls">
                    <label for="historyLoadDate" style="font-weight: bold;">查询日期:</label>
                    <input type="date" id="historyLoadDate" class="date-input">
                    <button id="fetchHistoryLoadBtn" class="btn">查询历史数据</button>
                </div>
                <p id="historyLoadError" class="error-message"></p>
                <div class="chart-container">
                    <canvas id="historyLoadChart"></canvas>
                    <div class="chart-buttons">
                        <button class="forecast-btn" value="hourly">Hourly</button>
                        <button class="forecast-btn" value="5min">5min</button>
                        <button class="forecast-btn" value="15min">15min</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 储能数据图表 -->
    <div class="card">
        <div class="row">
            <!-- 左侧: 实时储能 -->
            <div class="col">
                <h2 class="card-title">今日实时储能 (MW)</h2>
                <div class="chart-container">
                    <canvas id="realtimeStorageChart"></canvas>
                </div>
            </div>
            <!-- 右侧: 历史储能 -->
            <div class="col">
                <h2 class="card-title">历史储能</h2>
                <div class="controls">
                    <label for="historyStorageDate" style="font-weight: bold;">查询日期:</label>
                    <input type="date" id="historyStorageDate" class="date-input">
                    <button id="fetchHistoryStorageBtn" class="btn">查询历史数据</button>
                </div>
                <p id="historyStorageError" class="error-message"></p>
                <div class="chart-container">
                    <canvas id="historyStorageChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2 class="card-title">主干网络实时电价</h2>
        <div class="row" id="hubRealtimeLmpChartsContainer">
            <!-- JS will populate this -->
        </div>
    </div>

    <!-- 主干电网历史电价查询 -->
    <div class="card">
        <h2 class="card-title">主干电网历史电价查询</h2>
        <div class="controls">
            <label style="font-weight: bold;">市场类型:</label>
            <input type="radio" id="hub_market_day_ahead" name="hub_history_market" value="day_ahead_hourly" checked><label for="hub_market_day_ahead">日前</label>
            <input type="radio" id="hub_market_real_time" name="hub_history_market" value="real_time_5_min"><label for="hub_market_real_time">实时</label>
            <label for="hubHistoryLmpDate" style="font-weight: bold; margin-left: 20px;">查询日期:</label>
            <input type="date" id="hubHistoryLmpDate" class="date-input">
            <button id="fetchHubHistoryLmpBtn" class="btn">查询</button>
        </div>
        <div id="hubSelectorContainer" class="hub-selector-container"><span style="font-weight: bold;">主干网络:</span> <span>加载中...</span></div>
        <p id="hubHistoryLmpError" class="error-message"></p>
        <div class="chart-container"><canvas id="hubHistoryLmpChart"></canvas></div>
    </div>

    <!-- 地区历史电价查询 -->
    <div class="card">
        <h2 class="card-title">地区历史电价查询</h2>
        <div class="controls" style="margin-bottom: 20px;">
            <label style="font-weight: bold;">市场类型:</label>
            <input type="radio" id="market_day_ahead" name="history_market" value="day_ahead_hourly" checked>
            <label for="market_day_ahead">日前</label>
            <input type="radio" id="market_real_time" name="history_market" value="real_time_5_min">
            <label for="market_real_time">实时</label>
            <label for="historyLmpDate" style="font-weight: bold; margin-left: 20px;">查询日期:</label>
            <input type="date" id="historyLmpDate" class="date-input">
            <button id="fetchHistoryLmpBtn" class="btn">查询</button>
        </div>
        <p id="historyLmpError" class="error-message"></p>
        <div class="history-lmp-wrapper">
            <div class="chart-container">
                <canvas id="historyLmpChart"></canvas>
            </div>
            <div class="location-selector-container">
                <h3 style="margin-top:0;">选择地区</h3>
                <input type="text" id="locationSearchInput" class="search-input" placeholder="搜索地区...">
                <div id="locationSelector" class="location-selector">
                    <p>请先查询数据...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 燃料组合板块 -->
    <div class="card">
        <div class="row">
            <!-- 左侧: 今日燃料组合 -->
            <div class="col">
                <h2 class="card-title">今日燃料组合 (Fuel Mix)</h2>
                <div class="chart-container">
                    <canvas id="todayFuelMixChart"></canvas>
                </div>
            </div>
            <!-- 右侧: 历史燃料组合 -->
            <div class="col">
                <h2 class="card-title">历史燃料组合查询</h2>
                <div class="controls">
                    <label for="historyFuelMixDate" style="font-weight: bold;">查询日期:</label>
                    <input type="date" id="historyFuelMixDate" class="date-input">
                    <button id="fetchHistoryFuelMixBtn" class="btn">查询</button>
                </div>
                <p id="historyFuelMixError" class="error-message"></p>
                <div class="chart-container">
                    <canvas id="historyFuelMixChart"></canvas>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
// 当整个页面的DOM加载完成后执行初始化函数
document.addEventListener('DOMContentLoaded', function() {

    // ==========================================================
    //                   通用工具函数
    // ==========================================================

    /**
     * 创建并初始化一个 Chart.js 图表实例
     * @param {string} canvasId - canvas 元素的 ID
     * @param {string} label - 数据集的标签
     * @param {string} yAxisLabel - Y 轴的标题
     * @param {string} borderColor - 线条颜色
     * @param {string} backgroundColor - 填充颜色
     * @returns {Chart} Chart.js 图表实例
     */
    function createChart(canvasId, label, yAxisLabel, borderColor, backgroundColor) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        return new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: label, data: [],
                    borderColor: borderColor, backgroundColor: backgroundColor,
                    tension: 0.1, fill: true, borderWidth: 2
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'time',
                        time: { unit: 'hour', tooltipFormat: 'HH:mm', displayFormats: { hour: 'HH:mm' } },
                        title: { display: true, text: '时间' }
                    },
                    y: { 
                        beginAtZero: false,
                        title: { display: true, text: yAxisLabel }
                    }
                }
            }
        });
    }
    
    /**
     * 将API返回的数据转换为Chart.js时间序列能识别的格式
     * @param {object} data - API返回的原始数据, 格式为 {time: ['HH:MM'], value: [number]}
     * @param {string} dateString - 日期字符串, 格式为 'YYYY-MM-DD'
     * @returns {array} - 转换后的数据, 格式为 [{x: Date对象, y: 数值}, ...]
     */
    function formatDataForChart(data, dateString) {
        return data.time.map((timeStr, index) => {
            const [hours, minutes] = timeStr.split(':');
            const date = new Date(`${dateString}T00:00:00`);
            date.setHours(hours, minutes, 0, 0); 
            return { x: date, y: data.value[index] };
        });
    }

    /**
     * 设置日期输入框的默认值为昨天
     * @param {string} inputId - 日期输入框的 ID
     */
    function setDefaultDateToYesterday(inputId) {
        const dateInput = document.getElementById(inputId);
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        dateInput.value = yesterday.toISOString().split('T')[0];
    }

    // ==========================================================
    //                   实时数据标签
    // ==========================================================
    
    async function updateRealtimeLabels() {
        try {
            // 获取负荷数据
            const loadResponse = await fetch('/api/load/latest');
            const loadData = await loadResponse.json();
            if (!loadData.error) {
                document.getElementById('latestLoadValue').textContent = loadData.value.toFixed(0);
                document.getElementById('latestLoadTime').textContent = loadData.time;
            }

            // 获取储能数据
            const storageResponse = await fetch('/api/storage/latest');
            const storageData = await storageResponse.json();
            if (!storageData.error) {
                document.getElementById('latestStorageValue').textContent = storageData.value.toFixed(0);
                document.getElementById('latestStorageTime').textContent = storageData.time;
            }
        } catch (error) {
            console.error('更新实时数据标签失败:', error);
        }
    }

    // 更新主干电网实时电价标签的函数
    async function updateRealtimeHubLmpLabels() {
        const container = document.getElementById('latestHubLmpContainer');
        try {
            const response = await fetch('/api/lmp/trading_hubs/latest');
            const data = await response.json();
            if (data.error) throw new Error(data.error);

            container.innerHTML = ''; // 清空旧内容
            
            const markets = {
                day_ahead_hourly: '日前市场 (Hourly)',
                real_time_5_min: '实时市场 (5-Min)'
            };

            for (const marketId in markets) {
                const marketName = markets[marketId];
                const marketGroup = document.createElement('div');
                marketGroup.className = 'market-group';
                
                const title = document.createElement('h4');
                title.textContent = marketName;
                marketGroup.appendChild(title);

                const labelsContainer = document.createElement('div');
                labelsContainer.className = 'realtime-labels-container';

                for (const location in data.locations) {
                    const lmpData = data.locations[location][marketId];
                    const dataLabel = document.createElement('div');
                    dataLabel.className = 'data-label';
                    
                    let content = `<h3>${location}</h3>`;
                    if (lmpData && !lmpData.error) {
                        content += `<p>${lmpData.value.toFixed(2)} <span class="time"> @ ${lmpData.time}</span></p>`;
                    } else {
                        content += `<p><span class="time">无数据</span></p>`;
                    }
                    dataLabel.innerHTML = content;
                    labelsContainer.appendChild(dataLabel);
                }
                marketGroup.appendChild(labelsContainer);
                container.appendChild(marketGroup);
            }

        } catch (error) {
            container.innerHTML = '<p style="color: red;">加载主干电网实时电价失败。</p>';
            console.error('Failed to update hub LMP labels:', error);
        }
    }

    // ==========================================================
    //                   电力负荷图表
    // ==========================================================

    // --- 当日负荷图表 ---
    const realtimeLoadChart = createChart('realtimeLoadChart', '实时负荷', '负荷 (MW)', 'rgb(75, 192, 192)', 'rgba(75, 192, 192, 0.2)');
    
    async function updateRealtimeLoadChart() {
        try {
            const response = await fetch('/api/load/today');
            const data = await response.json();
            if (data.error) return;
            const todayStr = new Date().toISOString().split('T')[0];
            realtimeLoadChart.data.datasets[0].data = formatDataForChart(data, todayStr);
            realtimeLoadChart.update('none');
        } catch (error) {
            console.error('获取实时负荷数据失败:', error);
        }
    }

    // --- 历史负荷图表 ---
    const historyLoadCtx = document.getElementById('historyLoadChart').getContext('2d');
    const historyLoadDateInput = document.getElementById('historyLoadDate');
    const historyLoadError = document.getElementById('historyLoadError');
    const fetchHistoryLoadBtn = document.getElementById('fetchHistoryLoadBtn');
    const forecastButtons = document.querySelectorAll('.forecast-btn');
    let currentDisplayLoadDate = null;

    const datasetStyles = {
        history: { label: '历史负荷', borderColor: 'rgb(54, 162, 235)', borderWidth: 3 },
        hourly:  { label: '预测 (Hourly)', borderColor: 'rgb(255, 99, 132)', borderDash: [5, 5] },
        '5min':  { label: '预测 (5min)', borderColor: 'rgb(75, 192, 192)', borderDash: [5, 5] },
        '15min': { label: '预测 (15min)', borderColor: 'rgb(255, 206, 86)', borderDash: [5, 5] }
    };

    const historyLoadChart = new Chart(historyLoadCtx, {
        type: 'line', data: { datasets: [] },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { position: 'top' }, tooltip: { mode: 'index', intersect: false } },
            scales: {
                x: {
                    type: 'time', time: { unit: 'hour', tooltipFormat: 'HH:mm', displayFormats: { hour: 'HH:mm' } },
                    title: { display: true, text: '时间' }
                },
                y: { title: { display: true, text: '负荷 (MW)' }, beginAtZero: false }
            }
        }
    });

    async function resetAndFetchHistoryLoad() {
        const selectedDate = historyLoadDateInput.value;
        if (!selectedDate) {
            historyLoadError.textContent = '请选择一个有效的日期。';
            return;
        }
        historyLoadError.textContent = '';
        fetchHistoryLoadBtn.disabled = true;
        fetchHistoryLoadBtn.textContent = '查询中...';
        historyLoadChart.data.datasets = [];
        historyLoadChart.update();
        forecastButtons.forEach(btn => btn.classList.remove('active'));

        try {
            const response = await fetch(`/api/load/history?date=${selectedDate}`);
            const result = await response.json();
            if (result.error) { throw new Error(result.error); }
            
            historyLoadChart.data.datasets.push({
                ...datasetStyles.history,
                data: formatDataForChart(result, selectedDate)
            });
            historyLoadChart.update();
            currentDisplayLoadDate = selectedDate;
        } catch (error) {
            historyLoadError.textContent = `获取历史负荷失败: ${error.message}`;
            currentDisplayLoadDate = null;
        } finally {
            fetchHistoryLoadBtn.disabled = false;
            fetchHistoryLoadBtn.textContent = '查询历史数据';
        }
    }

    async function addOrUpdateForecast(button) {
        const selectedDate = historyLoadDateInput.value;
        const option = button.value;

        if (!currentDisplayLoadDate || selectedDate !== currentDisplayLoadDate) {
            historyLoadError.textContent = '日期已更改或未加载，请先查询历史数据。';
            return;
        }
        
        historyLoadError.textContent = '';
        button.disabled = true;

        try {
            const style = datasetStyles[option];
            const datasetLabel = style.label;
            const existingDatasetIndex = historyLoadChart.data.datasets.findIndex(d => d.label === datasetLabel);

            if (existingDatasetIndex > -1) {
                historyLoadChart.data.datasets.splice(existingDatasetIndex, 1);
                button.classList.remove('active');
            } else {
                const response = await fetch(`/api/load/forecast?date=${selectedDate}&option=${option}`);
                const result = await response.json();
                if (result.error) { throw new Error(result.error); }

                historyLoadChart.data.datasets.push({
                    ...style,
                    data: formatDataForChart(result, selectedDate)
                });
                button.classList.add('active');
            }
            historyLoadChart.update();
        } catch (error) {
            historyLoadError.textContent = `获取预测数据 (${option}) 失败: ${error.message}`;
        } finally {
            button.disabled = false;
        }
    }

    // ==========================================================
    //                   储能图表
    // ==========================================================

    // --- 当日储能图表 ---
    const realtimeStorageChart = createChart('realtimeStorageChart', '实时储能', '储能 (MW)', 'rgb(153, 102, 255)', 'rgba(153, 102, 255, 0.2)');

    async function updateRealtimeStorageChart() {
        try {
            const response = await fetch('/api/storage/today');
            const data = await response.json();
            if (data.error) return;
            const todayStr = new Date().toISOString().split('T')[0];
            realtimeStorageChart.data.datasets[0].data = formatDataForChart(data, todayStr);
            realtimeStorageChart.update('none');
        } catch (error) {
            console.error('获取实时储能数据失败:', error);
        }
    }

    // --- 历史储能图表 ---
    const historyStorageDateInput = document.getElementById('historyStorageDate');
    const fetchHistoryStorageBtn = document.getElementById('fetchHistoryStorageBtn');
    const historyStorageError = document.getElementById('historyStorageError');
    const historyStorageChart = createChart('historyStorageChart', '历史储能', '储能 (MW)', 'rgb(255, 159, 64)', 'rgba(255, 159, 64, 0.2)');

    async function fetchHistoryStorage() {
        const selectedDate = historyStorageDateInput.value;
        if (!selectedDate) {
            historyStorageError.textContent = '请选择一个有效的日期。';
            return;
        }
        historyStorageError.textContent = '';
        fetchHistoryStorageBtn.disabled = true;
        fetchHistoryStorageBtn.textContent = '查询中...';

        try {
            const response = await fetch(`/api/storage/history?date=${selectedDate}`);
            const result = await response.json();
            if (result.error) { throw new Error(result.error); }
            
            historyStorageChart.data.datasets[0].data = formatDataForChart(result, selectedDate);
            historyStorageChart.update();
        } catch (error) {
            historyStorageError.textContent = `获取历史储能失败: ${error.message}`;
        } finally {
            fetchHistoryStorageBtn.disabled = false;
            fetchHistoryStorageBtn.textContent = '查询历史数据';

    }

    // ==========================================================
    //                   主干网络当日电价图表
    // ==========================================================
    let hubRealtimeChartInstances = {};

    function createHubRealtimeLmpChart(canvasId) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        return new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [
                    { label: '日前小时电价', data: [], borderColor: 'rgb(255, 99, 132)', fill: false, borderWidth: 2, tension: 0.1 },
                    { label: '实时5分钟电价', data: [], borderColor: 'rgb(54, 162, 235)', fill: true, backgroundColor: 'rgba(54, 162, 235, 0.2)', borderWidth: 2, tension: 0.1 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { position: 'top' } },
                scales: {
                    x: { type: 'time', time: { unit: 'hour', tooltipFormat: 'HH:mm' }, title: { display: true, text: '时间' } },
                    y: { title: { display: true, text: '电价 ($/MWh)' } }
                }
            }
        });
    }

    async function initializeHubRealtimeCharts() {
        const container = document.getElementById('hubRealtimeLmpChartsContainer');
        container.innerHTML = '<p>加载中...</p>';
        try {
            const response = await fetch('/api/lmp/trading_hubs/today');
            const data = await response.json();
            if (data.error) throw new Error(data.error);

            container.innerHTML = ''; // Clear loading text
            const todayStr = new Date().toISOString().split('T')[0];

            for (const hubName in data.hubs) {
                const colDiv = document.createElement('div');
                colDiv.className = 'col';
                const title = document.createElement('h3');
                title.className = 'card-title';
                title.style.fontSize = '1.2em';
                title.textContent = hubName;
                const chartContainer = document.createElement('div');
                chartContainer.className = 'chart-container';
                const canvas = document.createElement('canvas');
                const canvasId = `hub-realtime-${hubName}`;
                canvas.id = canvasId;

                chartContainer.appendChild(canvas);
                colDiv.appendChild(title);
                colDiv.appendChild(chartContainer);
                container.appendChild(colDiv);

                const chart = createHubRealtimeLmpChart(canvasId);
                hubRealtimeChartInstances[hubName] = chart;

                const hubData = data.hubs[hubName];
                if (hubData.day_ahead_hourly && !hubData.day_ahead_hourly.error) {
                    chart.data.datasets[0].data = formatDataForChart(hubData.day_ahead_hourly, todayStr);
                }
                if (hubData.real_time_5_min && !hubData.real_time_5_min.error) {
                    chart.data.datasets[1].data = formatDataForChart(hubData.real_time_5_min, todayStr);
                }
                chart.update();
            }
        } catch (error) {
            container.innerHTML = '<p style="color: red;">加载主干网络实时电价图表失败。</p>';
            console.error('Failed to initialize hub realtime charts:', error);
        }
    }

    async function updateHubRealtimeCharts() {
        console.log("正在刷新主干网络实时电价图表...");
        try {
            const response = await fetch('/api/lmp/trading_hubs/today');
            const data = await response.json();
            if (data.error) throw new Error(data.error);

            const todayStr = new Date().toISOString().split('T')[0];
            for (const hubName in hubRealtimeChartInstances) {
                const chart = hubRealtimeChartInstances[hubName];
                const hubData = data.hubs[hubName];
                if (hubData) {
                    if (hubData.day_ahead_hourly && !hubData.day_ahead_hourly.error) {
                        chart.data.datasets[0].data = formatDataForChart(hubData.day_ahead_hourly, todayStr);
                    }
                    if (hubData.real_time_5_min && !hubData.real_time_5_min.error) {
                        chart.data.datasets[1].data = formatDataForChart(hubData.real_time_5_min, todayStr);
                    }
                    chart.update('none');
                }
            }
        } catch (error) {
            console.error('刷新主干网络实时电价图表失败:', error);
        }
    }


    // ==========================================================
    //                   主干电网历史电价
    // ==========================================================
    const hubHistoryLmpChart = createChart('hubHistoryLmpChart', '电价 ($/MWh)');
    const fetchHubHistoryLmpBtn = document.getElementById('fetchHubHistoryLmpBtn');
    const hubHistoryLmpDateInput = document.getElementById('hubHistoryLmpDate');
    const hubHistoryLmpError = document.getElementById('hubHistoryLmpError');
    const hubSelectorContainer = document.getElementById('hubSelectorContainer');

    async function initializeTradingHubSelector() {
        try {
            const response = await fetch('/api/locations/trading_hubs');
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            
            hubSelectorContainer.innerHTML = '<span style="font-weight: bold;">主干网络:</span>'; // Clear loading text
            data.locations.forEach(location => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'location-item';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `hub-${location}`;
                checkbox.value = location;
                const label = document.createElement('label');
                label.htmlFor = `hub-${location}`;
                label.textContent = location;
                itemDiv.appendChild(checkbox);
                itemDiv.appendChild(label);
                hubSelectorContainer.appendChild(itemDiv);
            });
        } catch (error) {
            hubSelectorContainer.innerHTML = '<span style="color: red;">加载主干网络列表失败</span>';
            console.error('Failed to load trading hubs:', error);
        }
    }

    fetchHubHistoryLmpBtn.addEventListener('click', async () => {
        const selectedDate = hubHistoryLmpDateInput.value;
        const selectedMarket = document.querySelector('input[name="hub_history_market"]:checked').value;
        const selectedHubs = Array.from(hubSelectorContainer.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);

        if (!selectedDate) { hubHistoryLmpError.textContent = '请选择一个有效的日期。'; return; }
        if (selectedHubs.length === 0) { hubHistoryLmpError.textContent = '请至少选择一个主干网络。'; return; }
        
        hubHistoryLmpError.textContent = '';
        fetchHubHistoryLmpBtn.disabled = true;
        fetchHubHistoryLmpBtn.textContent = '查询中...';
        hubHistoryLmpChart.data.datasets = [];

        try {
            const response = await fetch(`/api/lmp/trading_hubs/history?date=${selectedDate}&market=${selectedMarket}&locations=${selectedHubs.join(',')}`);
            const result = await response.json();
            if (result.error) throw new Error(result.error);
            
            let colorIndex = 0;
            for (const location in result) {
                const locationData = result[location];
                const newDataset = {
                    label: location,
                    data: formatDataForChart(locationData, selectedDate),
                    borderColor: chartColors[colorIndex % chartColors.length],
                    fill: false,
                    borderWidth: 2,
                    tension: 0.1
                };
                hubHistoryLmpChart.data.datasets.push(newDataset);
                colorIndex++;
            }
            hubHistoryLmpChart.update();

        } catch (error) {
            hubHistoryLmpError.textContent = `获取主干电网历史电价失败: ${error.message}`;
        } finally {
            fetchHubHistoryLmpBtn.disabled = false;
            fetchHubHistoryLmpBtn.textContent = '查询';
        }
    });

    // ==========================================================
    //                   历史电价查询逻辑
    // ==========================================================
    const fetchHistoryLmpBtn = document.getElementById('fetchHistoryLmpBtn');
    const historyLmpDateInput = document.getElementById('historyLmpDate');
    const historyLmpError = document.getElementById('historyLmpError');
    const locationSelector = document.getElementById('locationSelector');
    const locationSearchInput = document.getElementById('locationSearchInput'); 

    let allHistoryLmpData = {}; // 用于存储从API获取的所有地区数据
    const chartColors = [ // 预定义颜色列表
        'rgb(255, 99, 132)', 'rgb(54, 162, 235)', 'rgb(255, 206, 86)', 'rgb(75, 192, 192)', 
        'rgb(153, 102, 255)', 'rgb(255, 159, 64)', 'rgb(201, 203, 207)', 'rgb(231, 84, 128)',
        'rgb(13, 180, 185)', 'rgb(255, 119, 0)'
    ];

    // 初始化历史电价图表
    const historyLmpChart = new Chart(document.getElementById('historyLmpChart').getContext('2d'), {
        type: 'line',
        data: { datasets: [] },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { position: 'top' }, tooltip: { mode: 'index', intersect: false } },
            scales: {
                x: { type: 'time', time: { unit: 'hour', tooltipFormat: 'HH:mm', displayFormats: { hour: 'HH:mm' } }, title: { display: true, text: '时间' } },
                y: { beginAtZero: false, title: { display: true, text: '电价 ($/MWh)' } }
            }
        }
    });

    // 查询按钮点击事件
    fetchHistoryLmpBtn.addEventListener('click', async () => {
        const selectedDate = historyLmpDateInput.value;
        const selectedMarket = document.querySelector('input[name="history_market"]:checked').value;
        if (!selectedDate) {
            historyLmpError.textContent = '请选择一个有效的日期。';
            return;
        }
        historyLmpError.textContent = '';
        fetchHistoryLmpBtn.disabled = true;
        fetchHistoryLmpBtn.textContent = '查询中...';
        locationSelector.innerHTML = '<p>加载中...</p>';
        historyLmpChart.data.datasets = []; // 清空图表
        historyLmpChart.update();

        try {
            const response = await fetch(`/api/lmp/history/all_nodes?date=${selectedDate}&market=${selectedMarket}`);
            const result = await response.json();
            if (result.error) { throw new Error(result.error); }
            allHistoryLmpData = result;
            populateLocationSelector(Object.keys(result).sort()); // 按字母顺序排序
        } catch (error) {
            historyLmpError.textContent = `获取历史电价失败: ${error.message}`;
            locationSelector.innerHTML = '<p>数据加载失败。</p>';
        } finally {
            fetchHistoryLmpBtn.disabled = false;
            fetchHistoryLmpBtn.textContent = '查询';
        }
    });

    // 动态生成地区选择器
    function populateLocationSelector(locations) {
        locationSelector.innerHTML = ''; // 清空
        if (locations.length === 0) {
            locationSelector.innerHTML = '<p>未找到任何地区数据。</p>';
            return;
        }
        locations.forEach(location => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'location-item';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = `loc-${location}`;
            checkbox.value = location;
            checkbox.addEventListener('change', handleLocationSelectionChange);
            const label = document.createElement('label');
            label.htmlFor = `loc-${location}`;
            label.textContent = location;
            itemDiv.appendChild(checkbox);
            itemDiv.appendChild(label);
            locationSelector.appendChild(itemDiv);
        });
    }

    // 处理复选框选择变化的事件
    function handleLocationSelectionChange(event) {
        const location = event.target.value;
        const selectedDate = historyLmpDateInput.value;
        const existingDatasetIndex = historyLmpChart.data.datasets.findIndex(d => d.label === location);

        if (event.target.checked) {
            if (existingDatasetIndex === -1) { // 防止重复添加
                const locationData = allHistoryLmpData[location];
                const colorIndex = historyLmpChart.data.datasets.length % chartColors.length;
                const newDataset = {
                    label: location,
                    data: formatDataForChart(locationData, selectedDate),
                    borderColor: chartColors[colorIndex],
                    backgroundColor: chartColors[colorIndex].replace('rgb', 'rgba').replace(')', ', 0.1)'),
                    fill: false,
                    borderWidth: 2,
                    tension: 0.1
                };
                historyLmpChart.data.datasets.push(newDataset);
            }
        } else {
            if (existingDatasetIndex > -1) {
                historyLmpChart.data.datasets.splice(existingDatasetIndex, 1);
            }
        }
        historyLmpChart.update();
    }

    // 搜索框事件监听
    locationSearchInput.addEventListener('keyup', () => {
        const filter = locationSearchInput.value.toUpperCase();
        const items = locationSelector.getElementsByClassName('location-item');
        for (let i = 0; i < items.length; i++) {
            const label = items[i].getElementsByTagName('label')[0];
            if (label) {
                const txtValue = label.textContent || label.innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    items[i].style.display = "";
                } else {
                    items[i].style.display = "none";
                }
            }
        }
    });

    // ==========================================================
    //                   燃料组合图表逻辑
    // ==========================================================
    const fuelColors = {
        "Solar": "rgba(255, 206, 86, 0.7)", "Wind": "rgba(75, 192, 192, 0.7)",
        "Geothermal": "rgba(255, 99, 132, 0.7)", "Biomass": "rgba(139, 69, 19, 0.7)",
        "Biogas": "rgba(189, 183, 107, 0.7)", "Small Hydro": "rgba(173, 216, 230, 0.7)",
        "Coal": "rgba(105, 105, 105, 0.7)", "Nuclear": "rgba(153, 102, 255, 0.7)",
        "Natural Gas": "rgba(255, 159, 64, 0.7)", "Large Hydro": "rgba(54, 162, 235, 0.7)",
        "Batteries": "rgba(46, 204, 113, 0.7)", "Imports": "rgba(149, 165, 166, 0.7)",
        "Other": "rgba(211, 211, 211, 0.7)"
    };

    function createFuelMixChart(canvasId) {
        return new Chart(document.getElementById(canvasId).getContext('2d'), {
            type: 'line',
            data: { labels: [], datasets: [] },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { position: 'top' }, tooltip: { mode: 'index', intersect: false } },
                scales: {
                    x: { type: 'time', time: { unit: 'hour', tooltipFormat: 'HH:mm', displayFormats: { hour: 'HH:mm' } }, title: { display: true, text: '时间' } },
                    y: { stacked: true, title: { display: true, text: '发电量 (MW)' } }
                }
            }
        });
    }

    function processFuelMixData(chart, data, dateString) {
        const newDatasets = [];
        let timeLabels = [];
        const orderedEnergyTypes = Object.keys(fuelColors);

        for (const energyType of orderedEnergyTypes) {
            if (data[energyType]) {
                const energyData = data[energyType];
                if (timeLabels.length === 0) {
                    timeLabels = energyData.time.map(timeStr => {
                        const [hours, minutes] = timeStr.split(':');
                        const date = new Date(`${dateString}T00:00:00`);
                        date.setHours(hours, minutes, 0, 0);
                        return date;
                    });
                }
                newDatasets.push({
                    label: energyType, data: energyData.value,
                    backgroundColor: fuelColors[energyType] || 'rgba(128, 128, 128, 0.7)',
                    borderColor: fuelColors[energyType] ? fuelColors[energyType].replace('0.7', '1') : 'rgba(128, 128, 128, 1)',
                    borderWidth: 1, fill: true, tension: 0.2
                });
            }
        }
        chart.data.labels = timeLabels;
        chart.data.datasets = newDatasets;
        chart.update('none');
    }

    // --- 今日燃料组合 ---
    const todayFuelMixChart = createFuelMixChart('todayFuelMixChart');
    async function updateTodayFuelMixChart() {
        try {
            const response = await fetch('/api/fuel_mix/today');
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            const todayStr = new Date().toISOString().split('T')[0];
            processFuelMixData(todayFuelMixChart, data, todayStr);
        } catch (error) { console.error('获取今日燃料组合数据失败:', error); }
    }

    // --- 历史燃料组合 ---
    const historyFuelMixChart = createFuelMixChart('historyFuelMixChart');
    const fetchHistoryFuelMixBtn = document.getElementById('fetchHistoryFuelMixBtn');
    const historyFuelMixDateInput = document.getElementById('historyFuelMixDate');
    const historyFuelMixError = document.getElementById('historyFuelMixError');
    
    fetchHistoryFuelMixBtn.addEventListener('click', async () => {
        const selectedDate = historyFuelMixDateInput.value;
        if (!selectedDate) {
            historyFuelMixError.textContent = '请选择一个有效的日期。';
            return;
        }
        historyFuelMixError.textContent = '';
        fetchHistoryFuelMixBtn.disabled = true;
        fetchHistoryFuelMixBtn.textContent = '查询中...';

        try {
            const response = await fetch(`/api/fuel_mix/history?date=${selectedDate}`);
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            processFuelMixData(historyFuelMixChart, data, selectedDate);
        } catch (error) {
            historyFuelMixError.textContent = `获取历史燃料组合失败: ${error.message}`;
            console.error('获取历史燃料组合数据失败:', error);
        } finally {
            fetchHistoryFuelMixBtn.disabled = false;
            fetchHistoryFuelMixBtn.textContent = '查询';
        }
    });
    
    // ==========================================================
    //                   初始化与事件绑定
    // ==========================================================

    // --- 设置默认日期 ---
    setDefaultDateToYesterday('historyLoadDate');
    setDefaultDateToYesterday('historyStorageDate');
    setDefaultDateToYesterday('historyLmpDate'); 
    setDefaultDateToYesterday('historyFuelMixDate');

    // --- 绑定事件监听器 ---
    fetchHistoryLoadBtn.addEventListener('click', resetAndFetchHistoryLoad);
    forecastButtons.forEach(button => {
        button.addEventListener('click', () => addOrUpdateForecast(button));
    });
    fetchHistoryStorageBtn.addEventListener('click', fetchHistoryStorage);

    // 初始化主干电网选择器
    initializeTradingHubSelector(); 
    initializeHubRealtimeCharts(); 

    // --- 首次加载数据 ---
    updateRealtimeLabels();
    updateRealtimeHubLmpLabels(); // 更新主干电网实时电价标签
    updateRealtimeLoadChart();
    updateRealtimeStorageChart();
    updateTodayFuelMixChart();

    

    // --- 设置定时刷新 ---
    setInterval(updateRealtimeLabels, 300000); // 5分钟刷新实时数据标签
    setInterval(updateRealtimeHubLmpLabels, 300000); // 5分钟刷新主干电网实时电价
    //
    setInterval(updateRealtimeLoadChart, 300000); // 每5分钟刷新实时负荷图表
    setInterval(updateRealtimeStorageChart, 300000); // 每5分钟刷新实时储能图表
    setInterval(updateHubRealtimeCharts, 300000); // [新增]
    setInterval(updateTodayFuelMixChart, 300000);
});
</script>
