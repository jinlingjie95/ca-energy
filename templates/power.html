<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电力数据查看</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    
    <style>
        /* --- 页面基础和布局样式 --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }

        /* --- 卡片式布局样式 --- */
        .card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-header {
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 1.5em;
            font-weight: 600;
            margin: 0;
        }

        /* --- 用户控件样式 --- */
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 15px;
            flex-wrap: wrap; /* 在小屏幕上自动换行 */
        }
        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .date-input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .error-message {
            color: #dc3545;
            margin-top: 10px;
            font-size: 0.9em;
            min-height: 1.2em; /* 避免消息出现/消失时页面跳动 */
        }
        
        /* --- [核心修改] 图表容器与预测按钮的样式 --- */
        /* 1. 图表容器: 设置为相对定位，作为内部绝对定位按钮的参照物 */
        .chart-container {
            position: relative;
        }
        /* 2. 预测按钮组容器: 使用绝对定位，将其放置在图表容器的右上角 */
        .chart-buttons {
            position: absolute;
            top: 10px;      /* 距顶部10像素 */
            right: 45px;    /* 距右侧45像素，为图例留出空间 */
            z-index: 10;    /* 确保按钮在图表网格线的上方 */
            display: flex;
            gap: 8px;
        }
        /* 3. 预测按钮的具体样式 */
        .forecast-btn {
            background-color: #6c757d; /* 默认状态为灰色 */
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        /* 预测按钮的激活状态样式，用于表示其对应的数据已在图表中显示 */
        .forecast-btn.active {
             background-color: #28a745; /* 激活时变为绿色 */
        }
        /* 预测按钮的禁用状态样式 */
        .forecast-btn:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">实时电力负荷 (MW)</h2>
        </div>
        <canvas id="realtimeChart"></canvas>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 class="card-title">历史负荷与预测对比</h2>
            <div class="controls">
                <div class="control-group">
                    <label for="historyDate" style="font-weight: bold;">查询日期:</label>
                    <input type="date" id="historyDate" class="date-input">
                </div>
                <button id="fetchHistoryBtn" class="btn">查询历史数据</button>
            </div>
            <p id="historyError" class="error-message"></p>
        </div>
        
        <div class="chart-container">
            <canvas id="historyChart"></canvas>
            <div id="forecast-buttons-container" class="chart-buttons">
                <button class="forecast-btn" value="hourly">Hourly</button>
                <button class="forecast-btn" value="5min">5min</button>
                <button class="forecast-btn" value="15min">15min</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================================
    //                   第一部分: 实时图表逻辑
    // ==========================================================
    
    // 获取实时图表的canvas上下文
    const realtimeCtx = document.getElementById('realtimeChart').getContext('2d');
    
    // 初始化实时图表
    const realtimeChart = new Chart(realtimeCtx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: '实时负荷', data: [],
                borderColor: 'rgb(75, 192, 192)', backgroundColor: 'rgba(75, 192, 192, 0.2)',
                tension: 0.1, fill: true
            }]
        },
        options: { responsive: true, scales: { y: { beginAtZero: false } } }
    });

    /**
     * 异步函数：从后端获取实时数据并更新图表
     */
    async function updateRealtimeChart() {
        try {
            const response = await fetch('/api/realtime_load');
            const data = await response.json();
            if (data.error) return; // 如果有错误，静默处理
            realtimeChart.data.labels = data.time;
            realtimeChart.data.datasets[0].data = data.value;
            realtimeChart.update('none'); // 'none'表示无动画更新，适合实时场景
        } catch (error) {
            console.error('获取实时数据失败:', error);
        }
    }
    
    // 页面加载后立即执行一次，之后每5分钟（300000毫秒）自动刷新一次
    updateRealtimeChart();
    setInterval(updateRealtimeChart, 300000);

    // ==========================================================
    //          第二部分: 历史与预测图表逻辑 (本次核心修改)
    // ==========================================================

    // --- 1. 初始化和DOM元素获取 ---
    const historyCtx = document.getElementById('historyChart').getContext('2d');
    const dateInput = document.getElementById('historyDate');
    const historyError = document.getElementById('historyError');
    const fetchHistoryBtn = document.getElementById('fetchHistoryBtn');
    const forecastButtons = document.querySelectorAll('.forecast-btn');
    
    // --- 2. 状态管理 ---
    // 这个变量至关重要，用于记录当前图表上显示的是哪个日期的数据。
    // 它是判断用户是否更改了日期但未重新查询的依据。
    let currentDisplayDate = null;

    // --- 3. 初始化默认日期 ---
    // 为提升用户体验，默认将日期选择器设置为昨天
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    dateInput.value = yesterday.toISOString().split('T')[0];
    
    // --- 4. 数据集样式配置 ---
    // 将不同数据集的样式集中管理，方便修改和复用
    const datasetStyles = {
        history: { label: '历史负荷', borderColor: 'rgb(54, 162, 235)', borderWidth: 3 },
        hourly:  { label: '预测 (Hourly)', borderColor: 'rgb(255, 99, 132)', borderDash: [5, 5] },
        '5min':  { label: '预测 (5min)', borderColor: 'rgb(75, 192, 192)', borderDash: [5, 5] },
        '15min': { label: '预测 (15min)', borderColor: 'rgb(255, 206, 86)', borderDash: [5, 5] }
    };

    // --- 5. 图表初始化 ---
    const historyChart = new Chart(historyCtx, {
        type: 'line',
        data: { datasets: [] }, // 初始化时没有任何数据
        options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                legend: { position: 'top' }, // 显示图例以区分不同数据线
                tooltip: { mode: 'index', intersect: false } // 优化提示框体验
            },
            scales: {
                // 关键: 将X轴设置为'time'类型，配合日期适配器使用
                x: {
                    type: 'time',
                    time: {
                        unit: 'hour', // X轴主要刻度单位为小时
                        tooltipFormat: 'HH:mm', // 鼠标悬停时提示框中的时间格式
                        displayFormats: { hour: 'HH:mm' } // X轴上显示的时间格式
                    },
                    title: { display: true, text: '时间' }
                },
                y: {
                    title: { display: true, text: '负荷 (MW)' },
                    beginAtZero: false // Y轴不强制从0开始
                }
            }
        }
    });
    
    // --- 6. 核心功能函数 ---

    /**
     * 辅助函数: 将API返回的数据转换为Chart.js时间序列能识别的格式
     * @param {object} data - API返回的原始数据, 格式为 {time: ['HH:MM'], value: [number]}
     * @param {string} dateString - 日期字符串, 格式为 'YYYY-MM-DD'
     * @returns {array} - 转换后的数据, 格式为 [{x: 时间戳, y: 数值}, ...]
     */
    function formatDataForChart(data, dateString) {
        return data.time.map((timeStr, index) => {
            const [hours, minutes] = timeStr.split(':');
            const date = new Date(`${dateString}T00:00:00`); // 使用T00:00:00避免本地时区转换问题
            date.setHours(hours, minutes, 0, 0);
            return { x: date.getTime(), y: data.value[index] };
        });
    }

    /**
     * 主函数1: 查询历史数据 (此操作会完全重置图表)
     */
    async function resetAndFetchHistory() {
        const selectedDate = dateInput.value;
        if (!selectedDate) {
            historyError.textContent = '请选择一个有效的日期。';
            return;
        }

        // --- UI反馈 ---
        historyError.textContent = '';
        fetchHistoryBtn.disabled = true;
        fetchHistoryBtn.textContent = '查询中...';

        // --- 核心操作: 清空图表和重置状态 ---
        historyChart.data.datasets = []; // 清空所有数据集
        historyChart.update();
        forecastButtons.forEach(btn => btn.classList.remove('active')); // 重置预测按钮的激活状态

        try {
            // --- 数据获取与处理 ---
            const response = await fetch(`/api/history_load?date=${selectedDate}`);
            const result = await response.json();
            if (result.error) { throw new Error(result.error); }
            
            // --- 图表更新 ---
            historyChart.data.datasets.push({
                ...datasetStyles.history, // 使用预设的样式
                data: formatDataForChart(result, selectedDate)
            });
            historyChart.update();
            
            // --- 状态更新: 成功后，更新当前显示的日期状态 ---
            currentDisplayDate = selectedDate;

        } catch (error) {
            historyError.textContent = `获取历史数据失败: ${error.message}`;
            currentDisplayDate = null; // 查询失败，重置日期状态，用户需要重新查询
        } finally {
            // --- UI恢复 ---
            fetchHistoryBtn.disabled = false;
            fetchHistoryBtn.textContent = '查询历史数据';
        }
    }

    /**
     * 主函数2: 添加/移除预测数据 (增量更新图表)
     * @param {HTMLButtonElement} button - 被点击的预测按钮元素
     */
    async function addOrUpdateForecast(button) {
        const selectedDate = dateInput.value;
        const option = button.value; // 'hourly', '5min', 或 '15min'

        // --- 前置检查 ---
        // 1. 检查是否已加载了某个日期的历史数据
        if (!currentDisplayDate) {
            historyError.textContent = '请先点击“查询历史数据”加载基础图表。';
            return;
        }
        // 2. 检查用户是否在加载历史数据后又更改了日期但未重新查询
        if (selectedDate !== currentDisplayDate) {
            historyError.textContent = '日期已更改，请先重新“查询历史数据”。';
            return;
        }
        
        historyError.textContent = '';
        button.disabled = true; // 禁用当前点击的按钮，防止重复操作

        try {
            const style = datasetStyles[option];
            const datasetLabel = style.label;
            const existingDatasetIndex = historyChart.data.datasets.findIndex(d => d.label === datasetLabel);

            // --- 核心逻辑: Toggle (切换) ---
            // 如果图表中已存在该数据集，则将其移除
            if (existingDatasetIndex > -1) {
                historyChart.data.datasets.splice(existingDatasetIndex, 1);
                historyChart.update();
                button.classList.remove('active'); // 移除按钮的激活状态
            } else {
                // 如果不存在，则从API获取新数据并添加到图表
                const response = await fetch(`/api/load_forecast?date=${selectedDate}&option=${option}`);
                const result = await response.json();
                if (result.error) { throw new Error(result.error); }

                historyChart.data.datasets.push({
                    ...style, // 使用预设样式
                    data: formatDataForChart(result, selectedDate)
                });
                historyChart.update();
                button.classList.add('active'); // 添加成功后，激活按钮样式
            }
        } catch (error) {
            historyError.textContent = `获取预测数据 (${option}) 失败: ${error.message}`;
        } finally {
            button.disabled = false; // 无论成功失败，都恢复按钮
        }
    }

    // --- 7. 绑定事件监听器 ---

    // 为 "查询历史数据" 按钮绑定重置和查询功能
    fetchHistoryBtn.addEventListener('click', resetAndFetchHistory);

    // 循环为所有预测按钮绑定增量更新功能
    forecastButtons.forEach(button => {
        button.addEventListener('click', () => addOrUpdateForecast(button));
    });

</script>
</body>
</html>
