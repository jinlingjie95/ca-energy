{% extends "layout.html" %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
    .fire-page-layout {
        display: flex;
        gap: 20px;
        height: 85vh; /* 设置一个固定高度 */
    }
    
    /* 左侧事件列表面板 */
    .events-panel {
        flex: 0 0 380px; /* 固定宽度，不伸缩 */
        background: #f8f9fa;
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .events-panel h3 {
        margin: 0 0 10px 0;
        padding-bottom: 10px;
        border-bottom: 1px solid #dee2e6;
    }
    .events-list {
        overflow-y: auto; /* 列表内容过多时可滚动 */
        flex-grow: 1;
    }
    .event-item {
        padding: 10px;
        border-bottom: 1px solid #e9ecef;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    .event-item:hover, .event-item.active {
        background-color: #e9ecef;
    }
    .event-item h5 { margin: 0 0 5px 0; }
    .event-item p { margin: 0; font-size: 0.9em; color: #6c757d; }

    /* 右侧地图和控制面板 */
    .map-container {
        flex-grow: 1; /* 占据剩余空间 */
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .controls-bar {
        display: flex;
        gap: 15px;
        align-items: center;
        background: #fff;
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    #fireMap {
        height: 100%;
        border-radius: 8px;
    }
</style>

<div class="fire-page-container" style="max-width: 95%; margin: 1.5rem auto;">
    <h1 style="text-align: center; margin-bottom: 1.5rem;">美国山火信息平台</h1>

    <div class="fire-page-layout">
        <div class="events-panel">
            <h3>官方火灾事件 (近一年)</h3>
            <div id="eventsList" class="events-list">
                <p>正在加载事件列表...</p>
            </div>
        </div>

        <div class="map-container">
            <div class="controls-bar">
                <label for="fireDateInput" style="font-weight: bold;">查询历史火点:</label>
                <input type="date" id="fireDateInput" class="date-input">
                <button id="fetchFiresBtn" class="btn">查询</button>
                <span id="map-message" style="margin-left: auto;"></span>
            </div>
            <div id="fireMap"></div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const API_BASE_URL = '/api/fire';

    // --- 地图初始化 ---
    const map = L.map('fireMap').setView([39.8, -98.5], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let fireLayer = L.layerGroup().addTo(map); // 用于存放火点
    let eventMarker = null; // 用于存放被点击的事件标记

    // --- 事件列表 ---
    const eventsListContainer = document.getElementById('eventsList');
    
    async function fetchAndDisplayEvents() {
        try {
            const response = await fetch(`${API_BASE_URL}/events`);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error);

            eventsListContainer.innerHTML = '';
            data.events.forEach(event => {
                const item = document.createElement('div');
                item.className = 'event-item';
                item.dataset.lat = event.lat;
                item.dataset.lon = event.lon;
                item.innerHTML = `<h5>${event.title}</h5><p>${new Date(event.date).toLocaleDateString()}</p>`;
                
                item.addEventListener('click', () => {
                    // 移除旧标记
                    if (eventMarker) map.removeLayer(eventMarker);
                    
                    // 飞到新位置并添加标记
                    map.flyTo([event.lat, event.lon], 8);
                    eventMarker = L.marker([event.lat, event.lon]).addTo(map)
                        .bindPopup(`<b>${event.title}</b>`).openPopup();
                    
                    // 更新列表项的激活状态
                    document.querySelectorAll('.event-item.active').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                });
                eventsListContainer.appendChild(item);
            });
        } catch (error) {
            eventsListContainer.innerHTML = `<p style="color: red;">加载事件失败: ${error.message}</p>`;
        }
    }

    // --- 地图火点查询 ---
    const dateInput = document.getElementById('fireDateInput');
    const fetchBtn = document.getElementById('fetchFiresBtn');
    const mapMessage = document.getElementById('map-message');

    async function fetchAndDisplayFires(dateString = '') {
        mapMessage.textContent = '正在加载火点数据...';
        fireLayer.clearLayers(); // 清除旧的火点

        try {
            const url = dateString ? `${API_BASE_URL}/usa_by_date?date=${dateString}` : `${API_BASE_URL}/usa_by_date`;
            const response = await fetch(url);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error);

            data.fires.forEach(fire => {
                const radius = 3 + Math.sqrt(fire.frp) * 0.5;
                const color = fire.frp > 100 ? '#d90429' : (fire.frp > 50 ? '#f97316' : '#facc15');
                L.circleMarker([fire.lat, fire.lon], { radius, color, fillColor: color, fillOpacity: 0.7 })
                    .bindPopup(`<b>FRP:</b> ${fire.frp} MW<br><b>Time:</b> ${fire.acq_date} ${fire.acq_time}`)
                    .addTo(fireLayer);
            });
            mapMessage.textContent = `在 ${dateString || '过去24小时'} 内探测到 ${data.fires.length} 个火点。`;

        } catch (error) {
            mapMessage.textContent = `加载火点失败: ${error.message}`;
            mapMessage.style.color = 'red';
        }
    }

    // --- 事件监听和初始化 ---
    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;

    fetchBtn.addEventListener('click', () => {
        fetchAndDisplayFires(dateInput.value);
    });

    // 页面加载时执行
    fetchAndDisplayEvents();
    fetchAndDisplayFires(); // 默认加载近24小时火点
});
</script>
{% endblock %}
